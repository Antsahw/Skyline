[package]
name = "horizon-play"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "One step to play Fabric mods in Horizon on any system: finds Minecraft and Java, prepares once, starts the game; also Prism Launcher's wrapper command"

[dependencies]
horizon-prepare = { path = "../horizon-prepare" }
serde_json = "1"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Mojang's Java runtime (horizon-jvm's runtime.rs and libs.rs, shared by path), for a player with no Java 25.
ureq = { version = "2", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"
sha2 = "0.10"

[lints]
workspace = true
